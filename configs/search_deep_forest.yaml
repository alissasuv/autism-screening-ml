task: classification
scoring: f1

model:
  type: random_forest
  params:
    max_depth: null
    n_estimators: 10
    max_features: sqrt
    min_samples_split: 2
    min_samples_leaf: 1
    bootstrap: true
    random_state: 42
    n_jobs: 2

cv:
  n_splits: 3
  random_state: 17

search:
  method: grid
  parameters:
    n_estimators:
      values: [10, 25]
    min_samples_leaf:
      values: [1, 3]
