task: regression
scoring: mse

model:
  type: random_forest
  params:
    max_depth: null
    n_estimators: 3
    max_features: all
    min_samples_split: 2
    min_samples_leaf: 1
    bootstrap: true
    random_state: 42
    n_jobs: 1

cv:
  n_splits: 2
  random_state: 17

search:
  method: grid
  parameters:
    n_estimators:
      values: [3, 5]